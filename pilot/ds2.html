<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Apple Catch</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#7ec8ff; }
  canvas { display:block; width:100vw; height:100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let W = 800, H = 600;

  function resize() {
    W = canvas.width = Math.floor(window.innerWidth);
    H = canvas.height = Math.floor(window.innerHeight);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- input ----------
  const keys = Object.create(null);
  window.addEventListener('keydown', function (e) {
    const k = (e.key && e.key.length === 1) ? e.key.toLowerCase() : e.key;
    if (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'ArrowUp' || k === 'ArrowDown' || k === ' ') {
      e.preventDefault();
    }
    keys[k] = true;
    if (k === 'Enter' && game && game.over) reset();
  });
  window.addEventListener('keyup', function (e) {
    const k = (e.key && e.key.length === 1) ? e.key.toLowerCase() : e.key;
    keys[k] = false;
  });
  window.addEventListener('blur', function () { for (const k in keys) keys[k] = false; });

  // ---------- game ----------
  const BASKET_HALF = 48;
  const RIM_OFFSET = 96;          // rim y = H - RIM_OFFSET
  let game = null;
  let best = 0;

  function reset() {
    game = {
      score: 0,
      lives: 3,
      over: false,
      won: false,
      t: 0,
      apples: [],
      parts: [],
      spawnT: 0.5,
      basketX: W / 2,
      shake: 0,
      flash: 0,
      overT: 0
    };
  }

  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 60 + Math.random() * 240;
      game.parts.push({
        x: x, y: y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s - 60,
        life: 0.5 + Math.random() * 0.5,
        max: 1,
        size: 2 + Math.random() * 4,
        color: color
      });
    }
  }

  function updateParts(dt) {
    for (let i = game.parts.length - 1; i >= 0; i--) {
      const p = game.parts[i];
      p.life -= dt;
      if (p.life <= 0) { game.parts.splice(i, 1); continue; }
      p.vy += 900 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
  }

  function update(dt) {
    if (!game) return;
    if (game.over) {
      game.overT += dt;
      updateParts(dt);
      if (game.shake > 0) game.shake = Math.max(0, game.shake - dt * 40);
      if (game.flash > 0) game.flash = Math.max(0, game.flash - dt * 1.5);
      return;
    }

    game.t += dt;
    const diff = 1 + game.t / 20;   // difficulty ramps up over time

    // basket movement
    const SPEED = 470;
    if (keys['ArrowLeft'] || keys['a']) game.basketX -= SPEED * dt;
    if (keys['ArrowRight'] || keys['d']) game.basketX += SPEED * dt;
    game.basketX = Math.max(BASKET_HALF + 10, Math.min(W - BASKET_HALF - 10, game.basketX));

    // spawn
    game.spawnT -= dt;
    if (game.spawnT <= 0) {
      game.spawnT = Math.max(0.17, 0.92 / diff) * (0.65 + Math.random() * 0.7);
      const rotten = Math.random() < 0.32;
      const r = 13 + Math.random() * 5;
      const margin = r + 12;
      game.apples.push({
        x: margin + Math.random() * Math.max(20, W - margin * 2),
        y: -30,
        r: r,
        rotten: rotten,
        vy: (140 + game.t * 10) * (0.85 + Math.random() * 0.35),
        vx: (Math.random() - 0.5) * 70,
        rot: (Math.random() - 0.5) * 0.8,
        spin: (Math.random() - 0.5) * 3
      });
    }

    const rimY = H - RIM_OFFSET;

    for (let i = game.apples.length - 1; i >= 0; i--) {
      const a = game.apples[i];
      a.y += a.vy * dt;
      a.x += a.vx * dt;
      a.rot += a.spin * dt;

      if (a.x < a.r) { a.x = a.r; a.vx = Math.abs(a.vx); }
      if (a.x > W - a.r) { a.x = W - a.r; a.vx = -Math.abs(a.vx); }

      // caught by basket?
      if (a.y > rimY - 10 && a.y < rimY + 46 && Math.abs(a.x - game.basketX) < BASKET_HALF) {
        if (a.rotten) {
          game.lives--;
          game.shake = 16;
          game.flash = 0.5;
          burst(a.x, a.y, '#6b6a2a', 16);
        } else {
          game.score += 10;
          burst(a.x, a.y, '#ff5f5f', 12);
        }
        game.apples.splice(i, 1);
        if (game.lives <= 0) { game.lives = 0; game.over = true; game.overT = 0; }
        continue;
      }

      // hit the ground
      if (a.y - a.r > H) {
        if (!a.rotten) {
          game.lives--;
          game.flash = 0.45;
          game.shake = 10;
          burst(a.x, H - 24, '#ff5f5f', 10);
          if (game.lives <= 0) { game.lives = 0; game.over = true; game.overT = 0; }
        }
        game.apples.splice(i, 1);
      }
    }

    updateParts(dt);
    if (game.shake > 0) game.shake = Math.max(0, game.shake - dt * 40);
    if (game.flash > 0) game.flash = Math.max(0, game.flash - dt * 1.5);
    if (game.score > best) best = game.score;
  }

  // ---------- drawing helpers ----------
  function roundRect(x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.lineTo(x + w - rr, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
    ctx.lineTo(x + w, y + h - rr);
    ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
    ctx.lineTo(x + rr, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
    ctx.lineTo(x, y + rr);
    ctx.quadraticCurveTo(x, y, x + rr, y);
    ctx.closePath();
  }

  function drawAppleShape(x, y, r, rotten, rot) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot || 0);

    // shadowy aura for rotten ones
    if (rotten) {
      ctx.fillStyle = 'rgba(60,60,10,0.20)';
      ctx.beginPath();
      ctx.arc(0, 0, r + 6, 0, Math.PI * 2);
      ctx.fill();
    }

    const g = ctx.createRadialGradient(-r * 0.35, -r * 0.35, r * 0.15, 0, 0, r * 1.15);
    if (rotten) {
      g.addColorStop(0, '#9a8a44');
      g.addColorStop(0.55, '#6d6224');
      g.addColorStop(1, '#3a3512');
    } else {
      g.addColorStop(0, '#ff8a7a');
      g.addColorStop(0.5, '#e83b3b');
      g.addColorStop(1, '#9c0f16');
    }
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = rotten ? 'rgba(30,28,6,0.85)' : 'rgba(110,10,15,0.75)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    if (rotten) {
      ctx.fillStyle = 'rgba(25,22,5,0.75)';
      const spots = [[-r * 0.35, -r * 0.2, r * 0.22], [r * 0.32, r * 0.1, r * 0.18], [r * 0.05, r * 0.48, r * 0.15], [-r * 0.15, r * 0.05, r * 0.1]];
      for (let i = 0; i < spots.length; i++) {
        ctx.beginPath();
        ctx.arc(spots[i][0], spots[i][1], spots[i][2], 0, Math.PI * 2);
        ctx.fill();
      }
      // little worm
      ctx.strokeStyle = '#d8e07a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(r * 0.6, -r * 0.35);
      ctx.quadraticCurveTo(r * 1.2, -r * 0.7, r * 1.0, -r * 1.1);
      ctx.stroke();
    } else {
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.beginPath();
      ctx.ellipse(-r * 0.35, -r * 0.38, r * 0.26, r * 0.17, -0.6, 0, Math.PI * 2);
      ctx.fill();
    }

    // stem
    ctx.strokeStyle = '#5b3a1a';
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, -r * 0.9);
    ctx.lineTo(r * 0.1, -r * 1.35);
    ctx.stroke();

    // leaf
    ctx.fillStyle = rotten ? '#5c6b25' : '#3fae4a';
    ctx.beginPath();
    ctx.ellipse(r * 0.42, -r * 1.15, r * 0.34, r * 0.16, -0.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawBasket() {
    const x = game.basketX;
    const y = H - RIM_OFFSET;
    const bh = 50;

    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.13)';
    ctx.beginPath();
    ctx.ellipse(x, y + bh + 8, BASKET_HALF + 6, 9, 0, 0, Math.PI * 2);
    ctx.fill();

    // body
    const g = ctx.createLinearGradient(x - BASKET_HALF, 0, x + BASKET_HALF, 0);
    g.addColorStop(0, '#8b5a24');
    g.addColorStop(0.45, '#d59a54');
    g.addColorStop(1, '#8b5a24');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(x - BASKET_HALF, y);
    ctx.lineTo(x + BASKET_HALF, y);
    ctx.lineTo(x + BASKET_HALF - 15, y + bh);
    ctx.lineTo(x - BASKET_HALF + 15, y + bh);
    ctx.closePath();
    ctx.fill();

    // weave
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(x - BASKET_HALF, y);
    ctx.lineTo(x + BASKET_HALF, y);
    ctx.lineTo(x + BASKET_HALF - 15, y + bh);
    ctx.lineTo(x - BASKET_HALF + 15, y + bh);
    ctx.closePath();
    ctx.clip();

    ctx.strokeStyle = 'rgba(80,44,10,0.45)';
    ctx.lineWidth = 2;
    for (let i = 1; i < 4; i++) {
      const yy = y + i * (bh / 4);
      ctx.beginPath();
      ctx.moveTo(x - BASKET_HALF, yy);
      ctx.lineTo(x + BASKET_HALF, yy);
      ctx.stroke();
    }
    for (let i = -3; i <= 3; i++) {
      ctx.beginPath();
      ctx.moveTo(x + i * 14, y);
      ctx.lineTo(x + i * 11.5, y + bh);
      ctx.stroke();
    }
    ctx.restore();

    // rim
    ctx.fillStyle = '#a2672f';
    roundRect(x - BASKET_HALF - 5, y - 10, (BASKET_HALF + 5) * 2, 15, 7);
    ctx.fill();
    ctx.strokeStyle = 'rgba(80,44,10,0.7)';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  function drawHUD() {
    // score
    ctx.font = 'bold 24px system-ui, -apple-system, Segoe UI, Roboto, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.fillText('Score: ' + game.score, 22, 20);
    ctx.fillStyle = '#173a20';
    ctx.fillText('Score: ' + game.score, 20, 18);

    // lives as apples
    ctx.font = 'bold 20px system-ui, -apple-system, Segoe UI, Roboto, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.fillText('Lives:', W - 22, 20);
    ctx.fillStyle = '#173a20';
    ctx.fillText('Lives:', W - 20, 18);
    for (let i = 0; i < game.lives; i++) {
      drawAppleShape(W - 60 - i * 38, 58, 13, false, 0);
    }

    // controls hint
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.font = 'bold 16px system-ui, -apple-system, Segoe UI, Roboto, sans-serif';
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillText('\u2190 / \u2192  or  A / D  move the basket  \u2014  catch red apples, dodge rotten ones', W / 2, H - 14);
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.fillText('\u2190 / \u2192  or  A / D  move the basket  \u2014  catch red apples, dodge rotten ones', W / 2, H - 16);
  }

  function drawGameOver() {
    const a = Math.min(1, game.overT * 2.2);
    ctx.fillStyle = 'rgba(8, 18, 30,' + (0.66 * a) + ')';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.font = 'bold ' + Math.round(Math.min(W * 0.12, 74)) + 'px system-ui, -apple-system, Segoe UI, Roboto, sans-serif';
    ctx.fillText('GAME OVER', W / 2 + 4, H / 2 - 76 + 4);
    ctx.fillStyle = '#ff6b6b';
    ctx.fillText('GAME OVER', W / 2, H / 2 - 76);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold ' + Math.round(Math.min(W * 0.06, 36)) + 'px system-ui, -apple-system, Segoe UI, Roboto, sans-serif';
    ctx.fillText('Score: ' + game.score, W / 2, H / 2 + 4);

    ctx.fillStyle = '#ffe08a';
    ctx.font = 'bold ' + Math.round(Math.min(W * 0.035, 22)) + 'px system-ui, -apple-system, Segoe UI, Roboto, sans-serif';
    ctx.fillText('Best: ' + best, W / 2, H / 2 + 46);

    ctx.fillStyle = '#bfe9ff';
    ctx.font = 'bold ' + Math.round(Math.min(W * 0.04, 26)) + 'px system-ui, -apple-system, Segoe UI, Roboto, sans-serif';
    ctx.fillText('Press Enter to play again', W / 2, H / 2 + 114);
  }

  // ---------- render ----------
  function render() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, W, H);

    ctx.save();
    if (game.shake > 0) {
      ctx.translate((Math.random() - 0.5) * game.shake, (Math.random() - 0.5) * game.shake);
    }

    // sky
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#5fb6f5');
    sky.addColorStop(0.55, '#bde8ff');
    sky.addColorStop(1, '#eaf8cf');
    ctx.fillStyle = sky;
    ctx.fillRect(-30, -30, W + 60, H + 60);

    // sun
    ctx.fillStyle = 'rgba(255,245,190,0.85)';
    ctx.beginPath();
    ctx.arc(W * 0.84, H * 0.14, Math.min(W, H) * 0.055, 0, Math.PI * 2);
    ctx.fill();

    // hills
    ctx.fillStyle = '#9fd98a';
    ctx.beginPath();
    ctx.moveTo(-40, H - 70);
    ctx.quadraticCurveTo(W * 0.25, H - 160, W * 0.55, H - 80);
    ctx.quadraticCurveTo(W * 0.8, H - 20, W + 40, H - 95);
    ctx.lineTo(W + 40, H + 40);
    ctx.lineTo(-40, H + 40);
    ctx.closePath();
    ctx.fill();

    // ground
    const gr = ctx.createLinearGradient(0, H - 62, 0, H);
    gr.addColorStop(0, '#7ec95c');
    gr.addColorStop(1, '#4f9c3b');
    ctx.fillStyle = gr;
    ctx.fillRect(-30, H - 62, W + 60, 62);
    ctx.strokeStyle = 'rgba(40,80,30,0.25)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-30, H - 62);
    ctx.lineTo(W + 30, H - 62);
    ctx.stroke();

    // apples
    for (let i = 0; i < game.apples.length; i++) {
      const a = game.apples[i];
      drawAppleShape(a.x, a.y, a.r, a.rotten, a.rot);
    }

    // particles
    for (let i = 0; i < game.parts.length; i++) {
      const p = game.parts[i];
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    drawBasket();

    // damage flash
    if (game.flash > 0) {
      ctx.fillStyle = 'rgba(255,40,40,' + (game.flash * 0.38) + ')';
      ctx.fillRect(-30, -30, W + 60, H + 60);
    }

    ctx.restore();

    drawHUD();

    if (game.over) drawGameOver();
  }

  // ---------- loop ----------
  let last = 0;
  function frame(ts) {
    if (!last) last = ts;
    let dt = (ts - last) / 1000;
    last = ts;
    if (dt > 0.05) dt = 0.05;
    if (dt < 0) dt = 0;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  reset();
  requestAnimationFrame(frame);

  // ---------- API ----------
  window.__play = {
    controls: [
      { key: 'ArrowLeft', does: 'move the basket left' },
      { key: 'ArrowRight', does: 'move the basket right' },
      { key: 'a', does: 'move the basket left' },
      { key: 'd', does: 'move the basket right' },
      { key: 'Enter', does: 'restart after game over' }
    ],
    state: function () {
      return {
        score: game.score,
        lives: game.lives,
        over: game.over,
        won: game.won
      };
    }
  };
})();
</script>
</body>
</html>
