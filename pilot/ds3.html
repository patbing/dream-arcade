<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Asteroid Hunter</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#05060f; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  "use strict";

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const TAU = Math.PI * 2;

  let W = 0, H = 0;
  let stars = [];

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    stars = [];
    const n = Math.floor((W * H) / 9000);
    for (let i = 0; i < n; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.4 + 0.3,
        p: Math.random() * TAU
      });
    }
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- input ----------
  const keys = Object.create(null);
  const BLOCK = ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' ', 'Enter'];

  window.addEventListener('keydown', (e) => {
    if (BLOCK.indexOf(e.key) !== -1) e.preventDefault();
    if (e.key === 'Enter') {
      if (over) reset();
      return;
    }
    keys[e.key] = true;
  });
  window.addEventListener('keyup', (e) => {
    if (BLOCK.indexOf(e.key) !== -1) e.preventDefault();
    keys[e.key] = false;
  });

  // ---------- game state ----------
  let score = 0;
  let lives = 3;
  let over = false;
  let wave = 0;
  let waveFlash = 0;
  let timeAcc = 0;

  let ship = null;
  let bullets = [];
  let asteroids = [];
  let particles = [];

  function makeAsteroid(size, x, y, vx, vy) {
    const r = size === 3 ? 50 : (size === 2 ? 31 : 17);
    const n = 8 + Math.floor(Math.random() * 5);
    const pts = [];
    for (let i = 0; i < n; i++) pts.push(0.72 + Math.random() * 0.55);
    let v;
    if (vx === undefined) {
      const speed = 34 + Math.random() * 42 + (3 - size) * 26 + wave * 4;
      const ang = Math.random() * TAU;
      v = { x: Math.cos(ang) * speed, y: Math.sin(ang) * speed };
    } else {
      v = { x: vx, y: vy };
    }
    return {
      x, y, size, r,
      vx: v.x, vy: v.y,
      rot: Math.random() * TAU,
      spin: (Math.random() - 0.5) * 2.2,
      pts, n
    };
  }

  function startWave() {
    wave++;
    waveFlash = 1.6;
    const count = Math.min(2 + wave, 7);
    for (let i = 0; i < count; i++) {
      let x = 0, y = 0, tries = 0;
      do {
        const edge = Math.floor(Math.random() * 4);
        if (edge === 0) { x = Math.random() * W; y = -70; }
        else if (edge === 1) { x = Math.random() * W; y = H + 70; }
        else if (edge === 2) { x = -70; y = Math.random() * H * 0.6; }
        else { x = W + 70; y = Math.random() * H * 0.6; }
        tries++;
      } while (tries < 25 && Math.hypot(x - ship.x, y - ship.y) < 240);
      asteroids.push(makeAsteroid(3, x, y));
    }
  }

  function reset() {
    score = 0;
    lives = 3;
    over = false;
    wave = 0;
    waveFlash = 0;
    bullets = [];
    asteroids = [];
    particles = [];
    ship = { x: W / 2, y: H - 90, vx: 0, vy: 0, r: 12, cool: 0, invuln: 2.2, tilt: 0 };
    startWave();
  }

  function burst(x, y, count, color, speed) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * TAU;
      const s = speed * (0.3 + Math.random() * 0.9);
      const life = 0.3 + Math.random() * 0.6;
      particles.push({
        x, y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        life, maxLife: life,
        color
      });
    }
  }

  function splitAsteroid(a) {
    if (a.size <= 1) return;
    const ns = a.size - 1;
    const baseAng = Math.atan2(a.vy, a.vx);
    const baseSp = Math.hypot(a.vx, a.vy) * 0.75 + 50;
    for (let i = 0; i < 2; i++) {
      const b = makeAsteroid(ns, a.x, a.y, 0, 0);
      const ang = baseAng + (i === 0 ? 1 : -1) * (0.45 + Math.random() * 0.7);
      const sp = baseSp + Math.random() * 40;
      b.vx = Math.cos(ang) * sp;
      b.vy = Math.sin(ang) * sp;
      asteroids.push(b);
    }
  }

  function loseLife() {
    lives--;
    burst(ship.x, ship.y, 34, '#ff6b7d', 320);
    if (lives <= 0) {
      over = true;
      return;
    }
    ship.x = W / 2;
    ship.y = Math.min(H - 90, H * 0.85);
    ship.vx = 0;
    ship.vy = 0;
    ship.invuln = 2.4;
    // clear a safe zone
    for (let i = asteroids.length - 1; i >= 0; i--) {
      const a = asteroids[i];
      if (Math.hypot(a.x - ship.x, a.y - ship.y) < 230) {
        burst(a.x, a.y, 12, '#8fb6d8', 180);
        asteroids.splice(i, 1);
      }
    }
    if (asteroids.length === 0) startWave();
  }

  // ---------- update ----------
  function update(dt) {
    timeAcc += dt;

    // particles always animate
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      const d = Math.pow(0.12, dt);
      p.vx *= d;
      p.vy *= d;
    }

    if (over) return;

    if (waveFlash > 0) waveFlash -= dt;

    // --- ship movement ---
    const dirX = (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0);
    const dirY = (keys.ArrowDown ? 1 : 0) - (keys.ArrowUp ? 1 : 0);
    const SPEED = 350;
    const k = Math.min(1, dt * 11);
    ship.vx += (dirX * SPEED - ship.vx) * k;
    ship.vy += (dirY * SPEED - ship.vy) * k;

    ship.x += ship.vx * dt;
    ship.y += ship.vy * dt;

    const minY = Math.max(H * 0.45, 90);
    const maxY = H - 62;
    if (ship.x < ship.r) { ship.x = ship.r; ship.vx = 0; }
    if (ship.x > W - ship.r) { ship.x = W - ship.r; ship.vx = 0; }
    if (ship.y < minY) { ship.y = minY; ship.vy = 0; }
    if (ship.y > maxY) { ship.y = maxY; ship.vy = 0; }

    ship.tilt += ((ship.vx / SPEED) * 0.32 - ship.tilt) * Math.min(1, dt * 10);

    if (ship.invuln > 0) ship.invuln -= dt;

    // --- shooting ---
    ship.cool -= dt;
    if (keys[' '] && ship.cool <= 0 && bullets.length < 8) {
      bullets.push({ x: ship.x + Math.sin(ship.tilt) * 12, y: ship.y - 16, vy: -820, vx: 0 });
      ship.cool = 0.16;
      burst(ship.x + Math.sin(ship.tilt) * 14, ship.y - 18, 3, '#9fe8ff', 90);
    }

    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      if (b.y < -20 || b.x < -20 || b.x > W + 20) bullets.splice(i, 1);
    }

    // --- asteroids ---
    for (const a of asteroids) {
      a.x += a.vx * dt;
      a.y += a.vy * dt;
      a.rot += a.spin * dt;
      if (a.x < -a.r) a.x = W + a.r;
      if (a.x > W + a.r) a.x = -a.r;
      if (a.y < -a.r) a.y = H + a.r;
      if (a.y > H + a.r) a.y = -a.r;
    }

    // --- bullet hits ---
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      let hit = false;
      for (let j = asteroids.length - 1; j >= 0; j--) {
        const a = asteroids[j];
        if (Math.hypot(a.x - b.x, a.y - b.y) < a.r + 5) {
          hit = true;
          score += a.size === 3 ? 20 : (a.size === 2 ? 50 : 100);
          burst(a.x, a.y, a.size * 8, a.size === 1 ? '#ffd98a' : '#8fd8ff', 200);
          splitAsteroid(a);
          asteroids.splice(j, 1);
          break;
        }
      }
      if (hit) bullets.splice(i, 1);
    }

    // --- ship collisions ---
    if (ship.invuln <= 0) {
      for (let j = asteroids.length - 1; j >= 0; j--) {
        const a = asteroids[j];
        if (Math.hypot(a.x - ship.x, a.y - ship.y) < a.r + ship.r * 0.85) {
          loseLife();
          break;
        }
      }
    }

    // --- wave clear ---
    if (asteroids.length === 0 && !over) startWave();
  }

  // ---------- render ----------
  function drawShip() {
    if (ship.invuln > 0 && Math.floor(timeAcc * 12) % 2 === 0 && !over) return;
    ctx.save();
    ctx.translate(ship.x, ship.y);
    ctx.rotate(ship.tilt);

    // engine flame
    if (keys.ArrowUp && !over) {
      const f = 10 + Math.random() * 12;
      ctx.beginPath();
      ctx.moveTo(-6, 8);
      ctx.lineTo(0, 8 + f);
      ctx.lineTo(6, 8);
      ctx.closePath();
      ctx.fillStyle = 'rgba(120,220,255,0.85)';
      ctx.fill();
    }

    ctx.beginPath();
    ctx.moveTo(0, -17);
    ctx.lineTo(12, 12);
    ctx.lineTo(0, 6);
    ctx.lineTo(-12, 12);
    ctx.closePath();
    ctx.fillStyle = '#0b2b3d';
    ctx.fill();
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = '#6ff0ff';
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(0, -3, 3.2, 0, TAU);
    ctx.fillStyle = '#bff8ff';
    ctx.fill();

    ctx.restore();
  }

  function drawAsteroid(a) {
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.rotate(a.rot);
    ctx.beginPath();
    for (let i = 0; i < a.n; i++) {
      const ang = (i / a.n) * TAU;
      const rad = a.r * a.pts[i];
      const px = Math.cos(ang) * rad;
      const py = Math.sin(ang) * rad;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = a.size === 3 ? '#2a2f3d' : (a.size === 2 ? '#333a4b' : '#3d4559');
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = a.size === 3 ? '#8ea6c4' : '#a9c2dd';
    ctx.stroke();

    // a couple of craters
    ctx.beginPath();
    ctx.arc(a.r * 0.22, -a.r * 0.2, a.r * 0.18, 0, TAU);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(-a.r * 0.3, a.r * 0.25, a.r * 0.12, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  function drawHUD() {
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.font = 'bold 22px monospace';
    ctx.fillStyle = '#7ff3ff';
    ctx.fillText('SCORE ' + score, 22, 36);

    // lives as mini ships
    for (let i = 0; i < lives; i++) {
      const bx = 30 + i * 24;
      const by = 62;
      ctx.save();
      ctx.translate(bx, by);
      ctx.beginPath();
      ctx.moveTo(0, -9);
      ctx.lineTo(6.5, 7);
      ctx.lineTo(0, 3.5);
      ctx.lineTo(-6.5, 7);
      ctx.closePath();
      ctx.strokeStyle = '#6ff0ff';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
    }

    ctx.textAlign = 'right';
    ctx.font = 'bold 22px monospace';
    ctx.fillStyle = '#8fb6d8';
    ctx.fillText('WAVE ' + wave, W - 22, 36);

    ctx.textAlign = 'center';
    ctx.font = '14px monospace';
    ctx.fillStyle = 'rgba(150,200,230,0.55)';
    ctx.fillText('ARROWS move  |  SPACE fire  |  ENTER restart after game over', W / 2, H - 14);

    if (waveFlash > 0) {
      const al = Math.min(1, waveFlash);
      ctx.globalAlpha = al;
      ctx.textAlign = 'center';
      ctx.font = 'bold 44px monospace';
      ctx.fillStyle = '#7ff3ff';
      ctx.fillText('WAVE ' + wave, W / 2, H * 0.35);
      ctx.globalAlpha = 1;
    }
  }

  function render() {
    ctx.fillStyle = '#05060f';
    ctx.fillRect(0, 0, W, H);

    // starfield
    for (const s of stars) {
      const tw = 0.5 + 0.5 * Math.sin(timeAcc * 2 + s.p);
      ctx.globalAlpha = 0.25 + 0.75 * tw;
      ctx.fillStyle = '#cfe8ff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (const a of asteroids) drawAsteroid(a);

    // bullets
    ctx.fillStyle = '#bff8ff';
    for (const b of bullets) {
      ctx.fillRect(b.x - 2, b.y - 9, 4, 14);
    }

    // particles
    for (const p of particles) {
      const al = Math.max(0, p.life / p.maxLife);
      ctx.globalAlpha = al;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2 + al * 2.5, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (ship) drawShip();

    drawHUD();

    if (over) {
      ctx.fillStyle = 'rgba(0,0,0,0.68)';
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.font = 'bold 56px monospace';
      ctx.fillStyle = '#ff5a6e';
      ctx.fillText('GAME OVER', W / 2, H / 2 - 34);
      ctx.font = 'bold 26px monospace';
      ctx.fillStyle = '#e8f6ff';
      ctx.fillText('FINAL SCORE  ' + score, W / 2, H / 2 + 26);
      ctx.font = '20px monospace';
      ctx.fillStyle = '#7ff3ff';
      ctx.fillText('PRESS ENTER TO RESTART', W / 2, H / 2 + 74);
    }
  }

  // ---------- loop ----------
  let last = 0;
  function loop(t) {
    if (!last) last = t;
    let dt = (t - last) / 1000;
    last = t;
    if (dt > 0.05) dt = 0.05;
    if (dt < 0) dt = 0;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  // ---------- boot ----------
  ship = { x: W / 2, y: H - 90, vx: 0, vy: 0, r: 12, cool: 0, invuln: 2.2, tilt: 0 };
  reset();
  requestAnimationFrame(loop);

  // ---------- API ----------
  window.__play = {
    controls: [
      { key: 'ArrowLeft',  does: 'move ship left' },
      { key: 'ArrowRight', does: 'move ship right' },
      { key: 'ArrowUp',    does: 'move ship up (with engine flame)' },
      { key: 'ArrowDown',  does: 'move ship down' },
      { key: ' ',          does: 'fire bullets upward' },
      { key: 'Enter',      does: 'restart after game over' }
    ],
    state() {
      return { score: score, lives: lives, over: over, won: false };
    }
  };
})();
</script>
</body>
</html>
